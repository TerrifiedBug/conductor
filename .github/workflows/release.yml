name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: publish omp-conductor to npm
    if: github.repository == 'TerrifiedBug/conductor'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omp
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require tag to match package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        run: npm publish --provenance --access public
